name: build-android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # Generate Android platform files in the CI workspace if they are absent.
      # This does not automatically commit generated files back to GitHub.
      - name: Generate Android platform files if missing
        shell: bash
        run: |
          if [[ ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ]]; then
            echo "Android platform files are missing; generating them with Flutter..."
            flutter create --platforms=android --org com.fajr --project-name fajr .
          else
            echo "Android platform files already exist."
          fi
          test -f android/gradlew
          if [[ ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ]]; then
            echo "::error::Flutter did not generate Android app Gradle files."
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fajr-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
