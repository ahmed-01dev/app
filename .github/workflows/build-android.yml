
name: build-android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fajr Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files if missing
        shell: bash
        run: |
          if [[ ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ]]; then
            echo "Android files are missing. Generating Android platform..."
            flutter create --platforms=android --org com.fajr --project-name fajr .
          else
            echo "Android platform already exists."
          fi

          if [[ ! -f android/gradlew ]]; then
            echo "::error::Android Gradle wrapper was not generated."
            exit 1
          fi

          if [[ ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ]]; then
            echo "::error::Android app Gradle file is missing."
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart files
        run: dart format .

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK exists
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fajr-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
