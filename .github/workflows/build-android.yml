
name: build-android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fajr Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files if missing
        shell: bash
        run: |
          if [[ ! -f android/app/build.gradle && ! -f android/app/build.gradle.kts ]]; then
            echo "Generating Android platform files..."
            flutter create --platforms=android --org com.fajr --project-name fajr .
          fi

          if [[ ! -f android/gradlew ]]; then
            echo "::error::Android Gradle wrapper was not generated."
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Enable core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              gradle = groovy
              enabled = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          elif kotlin.exists():
              gradle = kotlin
              enabled = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              raise SystemExit("Android app Gradle file not found")

          text = gradle.read_text()

          if not re.search(r'coreLibraryDesugaringEnabled|isCoreLibraryDesugaringEnabled', text):
              pattern = r'compileOptions\s*\{'
              if re.search(pattern, text):
                  text = re.sub(
                      pattern,
                      lambda m: m.group(0) + "\n        " + enabled,
                      text,
                      count=1,
                  )
              else:
                  raise SystemExit("compileOptions block not found in Gradle file")

          if "desugar_jdk_libs" not in text:
              pattern = r'dependencies\s*\{'
              if re.search(pattern, text):
                  text = re.sub(
                      pattern,
                      lambda m: m.group(0) + "\n    " + dependency,
                      text,
                      count=1,
                  )
              else:
                  text += "\n\ndependencies {\n    " + dependency + "\n}\n"

          gradle.write_text(text)
          print("Core library desugaring configured successfully.")
          PY

      - name: Format Dart files
        run: dart format .

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK exists
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fajr-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
